<!-- render ```mermaid code blocks as diagrams on GitHub Pages -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('pre > code.language-mermaid').forEach(function (code) {
      var wrap = code.closest('div.highlighter-rouge') || code.parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      wrap.replaceWith(div);
    });
    mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
    mermaid.run({ querySelector: '.mermaid' });
  });
</script>
<style>.mermaid { text-align: center; margin: 1em 0; overflow-x: auto; }</style>
